name: pi5-rt-hz1000
# target must match inventory
# Change target, source path, and SHA before trying a build.
target: pi5-ubuntu
source_dir: /srv/kernel/linux
source_commit: '0000000000000000000000000000000000000000'
# Pi 3/4: bcm2711_defconfig ; Pi 5: bcm2712_defconfig
defconfig: bcm2712_defconfig
fragments:
  - configs/common/preempt-rt.cfg
  - configs/scheduler/hz1000.cfg
benchmark:
  duration_seconds: 60
  repetitions: 3
  priority: 80
  interval_us: 1000
  load: idle
  stress_workers: 2
